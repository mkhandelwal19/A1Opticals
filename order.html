<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Order confirmed — A1 Opticals</title>
<meta name="theme-color" content="#14181A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="store.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314181A'/><text x='50' y='67' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='48' font-weight='700' fill='%23FFFFFF'>A1</text></svg>">
</head>
<body data-page="order.html">
<div id="chrome-top"></div>

<main id="main">
  <div class="wrap">
    <div class="steps" id="steps"></div>
    <div id="wrap"></div>
  </div>
</main>

<div id="chrome-foot"></div>

<script src="catalog.js"></script>
<script src="site.js"></script>
<script src="store.js"></script>
<script src="chrome.js"></script>
<script>
(function(){
  'use strict';
  var esc = window.escapeHtml;
  var ref = new URLSearchParams(location.search).get('ref');
  var order = Store.orderByRef(ref);
  var wrap = document.getElementById('wrap');

  if (!order){
    document.getElementById('steps').hidden = true;
    wrap.innerHTML =
      '<div class="empty"><h3>We cannot find that order</h3>' +
      '<p>Orders in this preview live in your browser, so they will not be here on another device.</p>' +
      '<p style="margin-top:18px"><a class="btn btn-primary" href="account.html">Your orders</a></p></div>';
    return;
  }

  var trade = order.mode === 'trade';
  var rxNeeded = order.items.some(function(i){ return i.needsRx; });
  var stepsList = trade ? ['Order', 'Delivery', 'Payment', 'Confirmed'] : rxNeeded ? ['Bag', 'Prescription', 'Delivery', 'Payment', 'Confirmed'] : ['Bag', 'Delivery', 'Payment', 'Confirmed'];
  document.getElementById('steps').innerHTML = stepsList.map(function(s, i){
    var last = i === stepsList.length - 1;
    return '<div class="step ' + (last ? 'on' : 'done') + '"><b>' + (last ? i + 1 : '<i class="fa-solid fa-check" style="font-size:10px"></i>') + '</b><span>' + s + '</span></div>';
  }).join('');

  var when = new Date(order.placedAt);
  var fmt = { day: 'numeric', month: 'long', year: 'numeric' };
  var dl = order.delivery || { method: 'van' };
  var eta = new Date(when.getTime() + (dl.method === 'courier' ? 6 : rxNeeded ? 3 : 1) * 864e5);
  var pay = order.payment || {};
  var rx = order.rx;
  var contact = SITE.get('contact');
  var store = dl.store ? SITE.store(dl.store) : SITE.stores()[0];
  var awaitingTransfer = /transfer/i.test(pay.status || '');
  var payLater = /pay on/i.test(pay.status || '');

  var rxLine = '';
  if (rxNeeded && !trade) {
    if (!rx || rx.method === 'later') rxLine = 'We still need your prescription — <a href="account.html" style="color:var(--teal);font-weight:600">add it from your account</a>, reply to the WhatsApp with a photo, or bring it to the store. Nothing is cut until we have it.';
    else if (rx.method === 'call') rxLine = 'We will ring <strong>' + esc(order.customer.phone) + '</strong> within the hour for your power.';
    else if (rx.method === 'photo') rxLine = 'We read the prescription photo and confirm the power on WhatsApp before cutting.';
    else rxLine = 'Lenses are cut to <strong>' + esc(Store.rxSummary(rx)) + '</strong>. Change it free within 24 hours.';
  }

  wrap.innerHTML =
    '<div class="conf">' +
      '<div class="conf-mark"><i class="fa-solid fa-check"></i></div>' +
      '<h1>Thank you, ' + esc(order.customer.name.split(' ')[0]) + '.</h1>' +
      '<p style="margin-top:12px; color:var(--ink-2); font-size:17px">' +
        (awaitingTransfer
          ? 'Your order is placed and held for your bank transfer. It goes into work the moment the credit shows.'
          : dl.method === 'collect'
            ? 'Your order is confirmed for <strong>collection at ' + esc(store ? store.name + ', ' + store.city : 'the store') + '</strong>. We WhatsApp you when it is ready' + (payLater ? ' and you pay there' : '') + '.'
            : 'Your order is confirmed' + (dl.method === 'courier' ? ' and goes by courier, ' + esc(dl.days || '4–7 working days') : (order.customer.slot ? ' for <strong>' + esc(order.customer.slot).toLowerCase() + '</strong>' : '')) + '.') +
        ' The ' + (trade || order.customer.gstin ? 'GST invoice' : 'receipt') + ' has gone to <strong>' + esc(order.customer.email) + '</strong>.</p>' +
      '<div class="ref">' + esc(order.ref) + '</div>' +
      (rxLine ? '<div class="note" style="margin-top:18px"><i class="fa-solid fa-glasses"></i><div>' + rxLine + '</div></div>' : '') +

      '<div class="notify">' +
        '<div class="notify-h mono">Notifications sent</div>' +
        '<div class="notify-row"><i class="fa-solid fa-envelope"></i><div><b>Email · ' + esc(order.customer.email) + '</b>' +
          '<span>Order ' + esc(order.ref) + ' confirmed · ' + (trade || order.customer.gstin ? 'GST invoice attached' : 'receipt attached') + ' · ' + Store.rupees(order.total) + '</span></div><em>sent</em></div>' +
        '<div class="notify-row"><i class="fa-brands fa-whatsapp"></i><div><b>WhatsApp · ' + esc(order.customer.phone) + '</b>' +
          '<span>“A1 Opticals: order ' + esc(order.ref) + ' received, ' + order.items.reduce(function(n,i){ return n + i.qty; }, 0) + ' item' + (order.items.length === 1 && order.items[0].qty === 1 ? '' : 's') + '. ' + (rxNeeded && (!rx || rx.method === 'later') ? 'Reply with a photo of your prescription to get started.' : 'We will message again when it is ' + (dl.method === 'collect' ? 'ready to collect' : 'on its way') + '.') + '”</span></div><em>sent</em></div>' +
        '<div class="notify-row"><i class="fa-solid fa-bell"></i><div><b>A1 Opticals · new order</b>' +
          '<span>' + (trade ? 'Email and WhatsApp to the counter with the pick list and the delivery slot' : 'To the lab with the frame, lens package and power' + (dl.method === 'collect' ? ' · collection' : dl.method === 'courier' ? ' · courier' : ' · van, ' + esc(order.customer.slot || ''))) + '</span></div><em>sent</em></div>' +
        '<div class="notify-row muted"><i class="fa-solid fa-truck"></i><div><b>' + (dl.method === 'collect' ? 'When it is ready' : 'At dispatch') + '</b>' +
          '<span>' + (dl.method === 'collect' ? 'WhatsApp saying it is ready at the counter' : 'WhatsApp with the driver&#39;s name and expected time' + (trade ? ' · email with the e-way bill where applicable' : '')) + '</span></div><em>queued</em></div>' +
      '</div>' +

      '<div class="note test" style="margin-top:22px">' +
        '<i class="fa-solid fa-flask"></i>' +
        '<div><strong>Preview — nothing was charged and no message was sent.</strong> ' +
        'On the live platform these go out from the server: email through the transactional mail service, WhatsApp through the WhatsApp Business API, both triggered by the confirmed payment and never by this page.</div>' +
      '</div>' +

      '<div class="panel" style="margin-top:26px">' +
        '<h3>' + (trade || order.customer.gstin ? 'Tax invoice' : 'Receipt') + '</h3>' +
        '<div class="sum muted"><span>Placed</span><span>' + when.toLocaleDateString('en-IN', fmt) + '</span></div>' +
        '<div class="sum muted"><span>' + (dl.method === 'collect' ? 'Ready to collect' : 'Expected delivery') + '</span><span>by ' + eta.toLocaleDateString('en-IN', fmt) + '</span></div>' +
        '<div class="sum muted"><span>Paid by</span><span>' + esc(pay.method || '') + (pay.status ? ' · ' + esc(pay.status) : '') + '</span></div>' +
        '<div class="sum muted"><span>Payment ref</span><span class="tnum">' + esc(pay.paymentId || '') + '</span></div>' +

        '<div class="table-wrap" style="margin:18px 0">' +
          '<table><thead><tr>' +
            '<th>Item</th><th>HSN</th><th>Qty</th><th class="num">Rate</th><th class="num">GST</th><th class="num">Amount</th>' +
          '</tr></thead><tbody>' +
          order.items.map(function(i){
            var net = typeof i.net === 'number' ? i.net : i.gross;
            var split = Store.taxSplit(net, i.gstRate);
            return '<tr>' +
              '<td style="white-space:normal">' + esc(i.name) + '<br><span style="color:var(--muted); font-size:12px">' + esc(i.variant) + (i.lens ? ' · ' + esc(i.lens) : '') + (i.free ? ' · ' + i.free + ' free' : '') + '</span></td>' +
              '<td class="tnum">' + esc(i.hsn) + '</td>' +
              '<td class="tnum">' + i.qty + '</td>' +
              '<td class="num">' + Store.rupees(Math.round(split.base / i.qty)) + '</td>' +
              '<td class="num">' + i.gstRate + '% · ' + Store.rupees(split.tax) + '</td>' +
              '<td class="num">' + (i.discount ? '<s style="color:var(--muted)">' + Store.rupees(i.gross) + '</s> ' : '') + Store.rupees(net) + '</td>' +
            '</tr>';
          }).join('') +
          '</tbody></table>' +
        '</div>' +

        (order.discount ? '<div class="sum"><span>' + esc((Store.bogoRule() || {}).label || 'Offer') + ' discount</span><span class="teal">−' + Store.rupees(order.discount) + '</span></div>' : '') +
        '<div class="sum"><span>Taxable value</span><span>' + Store.rupees(order.base) + '</span></div>' +
        Object.keys(order.byRate || {}).sort().map(function(r){
          return '<div class="sum muted"><span>GST at ' + r + '%</span><span>' + Store.rupees(order.byRate[r]) + '</span></div>';
        }).join('') +
        '<div class="sum"><span>Delivery</span><span>' + (order.shipping === 0 ? 'Free' : Store.rupees(order.shipping)) + '</span></div>' +
        '<div class="sum total"><span>Total</span><span>' + Store.rupees(order.total) + '</span></div>' +
        '<p class="fine" style="text-align:left">A1 Opticals · ' + esc(contact.gstin) + ' · ' + esc(SITE.stores()[0] ? SITE.stores()[0].address : '') + '</p>' +
      '</div>' +

      '<div class="panel" style="margin-top:18px">' +
        '<h3>' + (dl.method === 'collect' ? 'Collecting from' : 'Delivering to') + '</h3>' +
        '<p style="color:var(--ink-2)">' +
          (dl.method === 'collect' && store
            ? '<strong>' + esc(store.address) + '</strong><br>' + esc(store.hours) + '<br>'
            : '') +
          (order.customer.shop ? '<strong>' + esc(order.customer.shop) + '</strong>' + (order.customer.gstin ? ' · GSTIN ' + esc(order.customer.gstin) : '') + '<br>' : '') +
          esc(order.customer.name) + '<br>' +
          (dl.method !== 'collect' ? esc(order.customer.address).replace(/\n/g, '<br>') + '<br>' + esc(order.customer.city) + ' ' + esc(order.customer.pin) + '<br>' : '') +
          esc(order.customer.phone) +
          (order.customer.slot ? '<br><span class="mono" style="text-transform:none; letter-spacing:.04em">' + esc(order.customer.slot) + '</span>' : '') +
          (order.customer.po ? '<br><span class="mono" style="text-transform:none; letter-spacing:.04em">' + (trade ? 'Your PO: ' : 'Gift note: ') + esc(order.customer.po) + '</span>' : '') +
          (order.customer.notes ? '<br><span class="mono" style="text-transform:none; letter-spacing:.04em">Notes: ' + esc(order.customer.notes) + '</span>' : '') +
        '</p>' +
      '</div>' +

      '<div style="display:flex; gap:12px; margin-top:24px; flex-wrap:wrap">' +
        '<a class="btn btn-primary" href="track.html?ref=' + encodeURIComponent(order.ref) + '">Track this order</a>' +
        '<a class="btn btn-soft" href="account.html">All your orders</a>' +
        '<a class="btn btn-soft" href="shop.html">Keep shopping</a>' +
      '</div>' +
    '</div>';
})();
</script>
</body>
</html>
