<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Book a free eye test — A1 Opticals</title>
<meta name="theme-color" content="#14181A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="store.css">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314181A'/><text x='50' y='67' text-anchor='middle' font-family='Helvetica,Arial,sans-serif' font-size='48' font-weight='700' fill='%23FFFFFF'>A1</text></svg>">
</head>
<body data-page="eye-test.html">
<div id="chrome-top"></div>

<main id="main">
  <div class="wrap">
    <div class="page-head" style="border:0">
      <div class="crumb"><a href="index.html">Home</a> / Book eye test</div>
      <h1>Book a free eye test</h1>
    </div>

    <div class="cart" style="padding-top:6px">
      <div>
        <div class="panel" id="book"></div>
      </div>
      <aside>
        <div class="panel">
          <h3>What happens</h3>
          <p style="font-size:14px;color:var(--ink-2)" id="etNote"></p>
          <div class="hr" style="margin:16px 0"></div>
          <div id="etStores" style="font-size:14px;color:var(--ink-2)"></div>
        </div>
      </aside>
    </div>
  </div>
</main>

<div id="chrome-foot"></div>

<script src="catalog.js"></script>
<script src="site.js"></script>
<script src="store.js"></script>
<script src="chrome.js"></script>
<script>
(function(){
  'use strict';
  var esc = window.escapeHtml;
  var cfg = SITE.get('eyeTest');
  var stores = SITE.stores().filter(function(s){ return s.eyeTest; });
  var contact = SITE.get('contact');
  var u = Store.getUser() || {};

  document.getElementById('etNote').textContent = cfg.note;
  document.getElementById('etStores').innerHTML = stores.map(function(s){
    return '<p><strong>' + esc(s.name) + ', ' + esc(s.city) + '</strong><br>' + esc(s.address) + '<br>' + esc(s.hours) + '</p>';
  }).join('') + '<p style="margin-top:10px">Or just walk in — <a href="' + esc(contact.phoneHref) + '" style="color:var(--teal);font-weight:600">' + esc(contact.phone) + '</a>.</p>';

  if (!cfg.on || !stores.length) {
    document.getElementById('book').innerHTML = '<h3>Online booking is paused</h3><p style="font-size:14px;color:var(--ink-2)">Walk in during store hours, or call ' + esc(contact.phone) + ' and we will find you a slot.</p>';
    return;
  }

  /* The next N days, Sundays out. Slots already booked in this browser show
     as taken, which is enough to demonstrate the shape of the thing. */
  var days = [];
  var today = new Date(); today.setHours(0, 0, 0, 0);
  for (var i = 0; i < cfg.daysAhead; i++) {
    var d = new Date(today.getTime() + i * 864e5);
    days.push({ date: d, closed: d.getDay() === 0 });
  }
  var pick = { store: stores[0].id, day: days.filter(function(x){ return !x.closed; })[0].date, slot: '' };
  function key(d){ return d.toISOString().slice(0, 10); }
  function taken(dayKey, slot){
    return Store.bookings().some(function(b){ return b.store === pick.store && b.date.slice(0, 10) === dayKey && b.slot === slot && b.status !== 'cancelled'; });
  }

  function render(){
    var host = document.getElementById('book');
    var now = new Date();
    host.innerHTML =
      '<h3>Choose a time</h3>' +
      (stores.length > 1 ? '<div class="field"><label for="etStore">Store</label><select id="etStore">' + stores.map(function(s){ return '<option value="' + esc(s.id) + '"' + (s.id === pick.store ? ' selected' : '') + '>' + esc(s.name + ', ' + s.city) + '</option>'; }).join('') + '</select></div>' : '') +
      '<div class="field"><label>Day</label><div class="days">' + days.map(function(x){
        return '<button type="button" class="day" data-day="' + key(x.date) + '" aria-pressed="' + (key(x.date) === key(pick.day)) + '"' + (x.closed ? ' disabled' : '') + '><small>' + x.date.toLocaleDateString('en-IN', { weekday: 'short' }) + '</small><b>' + x.date.getDate() + '</b><small>' + x.date.toLocaleDateString('en-IN', { month: 'short' }) + '</small></button>';
      }).join('') + '</div></div>' +
      '<div class="field"><label>Time · ' + cfg.minutes + ' minutes</label><div class="slots">' + cfg.slots.map(function(s){
        var past = key(pick.day) === key(now) && (+s.slice(0, 2) < now.getHours() + 1);
        var busy = taken(key(pick.day), s);
        return '<button type="button" class="slot" data-slot="' + esc(s) + '" aria-pressed="' + (s === pick.slot) + '"' + (past || busy ? ' disabled' : '') + '>' + esc(s) + '</button>';
      }).join('') + '</div></div>' +
      '<div class="row2">' +
        '<div class="field"><label for="etName">Your name</label><input id="etName" autocomplete="name" value="' + esc(u.name || '') + '"><span class="err" hidden></span></div>' +
        '<div class="field"><label for="etPhone">Mobile — the reminder goes here</label><input id="etPhone" type="tel" autocomplete="tel" value="' + esc(u.phone || '') + '"><span class="err" hidden></span></div>' +
      '</div>' +
      '<div class="field"><label for="etFor">Anything we should know? (optional)</label><input id="etFor" placeholder="e.g. it is for my son, aged 9 · I wear contact lenses"></div>' +
      '<p class="err" id="etErr" hidden style="color:#B3261E;font-size:13px;margin:-6px 0 12px"></p>' +
      '<button type="button" class="btn btn-primary btn-lg" id="etGo">Book this slot</button>';

    var st = document.getElementById('etStore');
    if (st) st.addEventListener('change', function(){ pick.store = st.value; pick.slot = ''; render(); });
    host.querySelectorAll('.day').forEach(function(b){ b.addEventListener('click', function(){ pick.day = new Date(b.getAttribute('data-day') + 'T00:00:00'); pick.slot = ''; render(); }); });
    host.querySelectorAll('.slot').forEach(function(b){ b.addEventListener('click', function(){ pick.slot = b.getAttribute('data-slot'); host.querySelectorAll('.slot').forEach(function(o){ o.setAttribute('aria-pressed', String(o === b)); }); }); });
    document.getElementById('etGo').addEventListener('click', function(){
      var name = document.getElementById('etName').value.trim(), phone = document.getElementById('etPhone').value.trim();
      var err = document.getElementById('etErr');
      if (!pick.slot) { err.hidden = false; err.textContent = 'Pick a time first.'; return; }
      if (name.length < 2 || !/^[+ 0-9-]{10,15}$/.test(phone)) { err.hidden = false; err.textContent = 'A name and a ten-digit mobile number, please.'; return; }
      var b = Store.book({ store: pick.store, date: key(pick.day), slot: pick.slot, customer: name, phone: phone, note: document.getElementById('etFor').value.trim() });
      var s = SITE.store(pick.store);
      window.modal('<h2>Booked — ' + esc(b.ref) + '</h2>' +
        '<p><strong>' + esc(pick.day.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })) + ' at ' + esc(pick.slot) + '</strong><br>' + esc(s.address) + '</p>' +
        '<p>A WhatsApp reminder goes to ' + esc(phone) + ' the evening before. Bring your current glasses if you have them. Your power is saved to this phone number afterwards, so you can order online without typing it.</p>' +
        '<div class="actions"><a class="btn btn-primary" href="account.html?tab=visits">See my bookings</a><button type="button" class="btn btn-soft" data-close>Done</button></div>');
      pick.slot = ''; render();
    });
  }
  render();
})();
</script>
</body>
</html>
